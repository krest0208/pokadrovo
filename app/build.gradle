plugins { id 'com.android.application' }
android {
    namespace 'ru.pokadrovo.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.pokadrovo.app'
        minSdk 26
        targetSdk 34
        versionCode 30
        versionName '3.0-restored-dev'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'API_BASE', '"' + (project.findProperty('pokadrovo.apiBase') ?: '') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES'] } }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.9.0'
    implementation 'androidx.media3:media3-transformer:1.9.0'
    implementation 'androidx.media3:media3-effect:1.9.0'
    implementation 'androidx.media3:media3-common:1.9.0'
    implementation 'com.google.guava:guava:33.4.8-android'
}
