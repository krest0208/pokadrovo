<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Аккаунт — Покадрово</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head><body data-page="auth"><header class="bar"><a class="brand" href="/">▰ Покадрово</a><nav><a href="/admin.html">Админка</a></nav></header><main class="wrap narrow"><h1>Мой аккаунт</h1><p class="muted">Войти, создать аккаунт или восстановить пароль.</p><div id="notice" class="notice" role="status" aria-live="polite"></div><div class="card" id="auth-box"><label>Электронная почта<input id="email" type="email" autocomplete="email" maxlength="254" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" minlength="10" maxlength="200"></label><div class="actions"><button id="login">Войти</button><button id="register" class="secondary">Зарегистрироваться</button></div><div class="actions"><button id="google" class="secondary">Google</button><button id="vk" class="secondary">VK</button><button id="reset-request" class="text-btn">Забыли пароль?</button></div></div><div class="card hidden" id="profile-box"><h2>Профиль</h2><div id="profile"></div><h3>Мои заказы</h3><div id="orders"></div><label>Услуга<select id="service"><option value="">— Выберите услугу —</option></select></label><div class="actions"><button id="buy">Создать заказ</button><button id="refresh" class="secondary">Обновить</button><button id="logout" class="secondary">Выйти</button></div><p class="muted">Оплата не интегрирована. Подтверждение покупки — вручную через администратора.</p></div></main><footer>Не передавайте пароль и коды подтверждения другим людям.</footer></body></html>
